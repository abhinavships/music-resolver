[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-resolver"
version = "0.1.0"
description = "Turn a music reference in an editing prompt into a licensed track fitted to the clip"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "opencv-python-headless",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]
ml = ["torch>=2.0", "transformers", "faiss-cpu", "silero-vad", "pyloudnorm", "beat-this"]
api = ["anthropic"]
ui = ["playwright"]

[project.scripts]
resolver = "resolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: needs network, API keys, model downloads or real media"]
addopts = "-m 'not live'"
